name: 问题反馈
description: 报告使用中遇到的问题
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        提交前请确认已经看过 README 的「常见问题」。**涉及变砖、无法开机的问题，请先停止操作，不要反复尝试。**
  - type: input
    id: version
    attributes:
      label: 工具箱版本
      placeholder: 例如 1.0.0（「设置 → 检查更新」可以看到）
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 手机型号与系统版本
      placeholder: 例如 一加 13，PJZ110_16.0.0.300(CN01)
    validations:
      required: true
  - type: dropdown
    id: feature
    attributes:
      label: 出问题的功能
      options: [设备识别, 重启与模式, Bootloader 解锁 / 上锁, 一键 Root, A/B 槽位, 应用双开, 系统工具, 其它]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 你做了什么操作，期望得到什么结果，实际发生了什么
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: 日志
      description: 展开界面底部的「日志」面板，复制相关内容粘贴到这里。请删除其中的序列号等个人信息
      render: text
