name: Release

# 推送 v 开头的标签（例如 v1.0.0）时构建安装包，并创建一个 Release 草稿。
# 草稿需要在 GitHub 上检查后手动点「Publish release」才会公开。
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 用标签设置版本号
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: 缓存第三方工具
        uses: actions/cache@v4
        with:
          path: .tools-cache
          key: tools-${{ hashFiles('scripts/fetch-tools.mjs') }}

      - name: 类型检查
        run: npm run typecheck

      - name: 下载工具并打包
        run: npm run dist
        env:
          # 写入应用，作为「检查更新」的默认仓库
          TOOLBOX_UPDATE_REPO: ${{ github.repository }}

      - name: 生成校验文件
        shell: bash
        working-directory: release
        run: sha256sum *.exe > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: 创建 Release 草稿
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            release/OnePlusToolbox-*.exe
            release/SHA256SUMS.txt
